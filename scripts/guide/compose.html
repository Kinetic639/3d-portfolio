<script type="module">
// Composes the test guide in the browser (three.js), driven by compose.mjs.
// See compose.mjs for what goes in and why.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const loader = new GLTFLoader();
const load = (url) => loader.loadAsync(url);

window.compose = async (recipe) => {
  const outfit = await load(recipe.outfit);
  const root = outfit.scene;

  // The outfit's skeleton drives everything: its bones by name.
  let outfitMesh = null;
  root.traverse((object) => { if (!outfitMesh && object.isSkinnedMesh) outfitMesh = object; });
  const bones = new Map(outfitMesh.skeleton.bones.map((bone) => [bone.name, bone]));
  const report = { meshes: [], clips: [], headTriangles: 0 };

  for (const part of recipe.parts) {
    const gltf = await load(part.url);
    const meshes = [];
    gltf.scene.traverse((object) => { if (object.isSkinnedMesh && !(part.skip ?? []).includes(object.name)) meshes.push(object); });
    for (const mesh of meshes) {
      if (part.headOnly === mesh.name) report.headTriangles = keepHead(mesh, part.headBones);
      // Same joints, the outfit's bones; the part keeps its own bind matrices.
      const skeleton = new THREE.Skeleton(mesh.skeleton.bones.map((bone) => bones.get(bone.name)), mesh.skeleton.boneInverses);
      outfitMesh.parent.add(mesh);
      mesh.bind(skeleton, mesh.bindMatrix);
    }
  }

  // One mesh, one skeleton (docs/characters.md): every part shares the rig and its bind pose, so their
  // geometry merges exactly. Two materials: an atlas of the colour textures, and the eyes (kept apart:
  // their texture is moved to make them look around). Colour only: normal and roughness maps are left out.
  const parts = [];
  root.traverse((object) => { if (object.isSkinnedMesh) parts.push(object); });
  const merged = mergeIntoOne(parts, outfitMesh.skeleton, recipe.atlas);
  for (const part of parts) part.parent.remove(part);
  outfitMesh = merged.mesh;
  root.add(merged.mesh);
  report.meshes = merged.report;

  // Clips from the animation libraries, renamed to plain roles.
  const clips = [];
  for (const library of recipe.libraries) {
    const gltf = await load(library.url);
    for (const [from, to] of Object.entries(library.clips)) {
      const source = gltf.animations.find((clip) => clip.name === from);
      if (!source) throw new Error(`No clip ${from} in ${library.url}`);
      const clip = source.clone();
      clip.name = to;
      // Only bones the guide has; translations only on the pelvis (the rest is rotation), so bone lengths stay the outfit's.
      clip.tracks = clip.tracks.filter((track) => {
        const [node, property] = track.name.split(".");
        return bones.has(node) && (property !== "position" || node === "pelvis") && property !== "scale";
      });
      clips.push(clip);
      report.clips.push(`${to}<-${from} ${clip.duration.toFixed(2)}s`);
    }
  }

  const exporter = new GLTFExporter();
  const glb = await exporter.parseAsync(root, { binary: true, animations: clips, maxTextureSize: recipe.maxTextureSize, onlyVisible: true });
  const bytes = new Uint8Array(glb);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return { report, base64: btoa(binary) };
};

/**
 * Merges the skinned parts into one mesh with one skeleton. `atlas` lists the materials whose textures
 * share one atlas, in its quadrants (left to right, top to bottom); any other material ("MI_Eyes")
 * stays a material of its own.
 */
function mergeIntoOne(parts, skeleton, atlas) {
  const SIZE = 2048;
  const CELL = SIZE / 2;
  const INSET = 4 / SIZE;
  const canvas = document.createElement("canvas");
  canvas.width = SIZE;
  canvas.height = SIZE;
  const context = canvas.getContext("2d");
  const quadrant = new Map(atlas.map((name, index) => [name, { x: index % 2, y: Math.floor(index / 2) }]));
  const drawn = new Set();
  const boneIndex = new Map(skeleton.bones.map((bone, index) => [bone.name, index]));
  const atlasGeometries = [];
  const ownGeometries = [];
  let ownMaterial = null;
  const report = [];

  for (const part of parts) {
    const material = part.material;
    let geometry = compact(part.geometry);
    for (const name of [...Object.keys(geometry.attributes)]) {
      if (!["position", "normal", "uv", "skinIndex", "skinWeight"].includes(name)) geometry.deleteAttribute(name);
    }
    // The part's joints by name, as indices into the shared skeleton (the same order here, checked anyway).
    const joints = geometry.attributes.skinIndex;
    const remapped = new Uint16Array(joints.count * 4);
    for (let i = 0; i < joints.count; i += 1) {
      for (let k = 0; k < 4; k += 1) remapped[i * 4 + k] = boneIndex.get(part.skeleton.bones[joints.getComponent(i, k)].name);
    }
    geometry.setAttribute("skinIndex", new THREE.BufferAttribute(remapped, 4));
    const spot = quadrant.get(material.name);
    if (spot) {
      if (!drawn.has(material.name)) {
        drawn.add(material.name);
        context.drawImage(material.map.image, spot.x * CELL, spot.y * CELL, CELL, CELL);
      }
      const uv = geometry.attributes.uv;
      for (let i = 0; i < uv.count; i += 1) {
        uv.setXY(i, spot.x * 0.5 + INSET + uv.getX(i) * (0.5 - 2 * INSET), spot.y * 0.5 + INSET + uv.getY(i) * (0.5 - 2 * INSET));
      }
      atlasGeometries.push(geometry);
    } else {
      ownMaterial = material;
      ownGeometries.push(geometry);
    }
    report.push(`${part.name}:${material.name}:${geometry.index.count / 3}`);
  }

  const atlasGeometry = mergeGeometries(atlasGeometries);
  const ownGeometry = mergeGeometries(ownGeometries);
  const geometry = mergeGeometries([atlasGeometry, ownGeometry], true);
  const texture = new THREE.CanvasTexture(canvas);
  texture.flipY = false;
  texture.colorSpace = THREE.SRGBColorSpace;
  // Double-sided when any part was: the inside of the shirt shows at the collar.
  const side = parts.some((part) => part.material.side === THREE.DoubleSide) ? THREE.DoubleSide : THREE.FrontSide;
  const atlasMaterial = new THREE.MeshStandardMaterial({ name: "MI_Guide", map: texture, roughness: 1, metalness: 0, side });
  for (const key of ["normalMap", "roughnessMap", "metalnessMap", "aoMap", "emissiveMap"]) ownMaterial[key] = null;
  ownMaterial.roughness = 1;
  ownMaterial.metalness = 0;
  const mesh = new THREE.SkinnedMesh(geometry, [atlasMaterial, ownMaterial]);
  mesh.name = "Guide";
  mesh.bind(new THREE.Skeleton(skeleton.bones, skeleton.boneInverses), new THREE.Matrix4());
  report.push(`merged: ${geometry.index.count / 3} triangles, ${geometry.attributes.position.count} vertices, ${geometry.groups.length} materials`);
  return { mesh, report };
}

/** The geometry with only the vertices its triangles use (the head cut from a whole body keeps only the head's). */
function compact(source) {
  const index = source.index.array;
  const map = new Map();
  const order = [];
  for (const vertex of index) if (!map.has(vertex)) { map.set(vertex, order.length); order.push(vertex); }
  const geometry = new THREE.BufferGeometry();
  for (const [name, attribute] of Object.entries(source.attributes)) {
    const size = attribute.itemSize;
    const array = new attribute.array.constructor(order.length * size);
    order.forEach((vertex, i) => { for (let k = 0; k < size; k += 1) array[i * size + k] = attribute.getComponent(vertex, k); });
    geometry.setAttribute(name, new THREE.BufferAttribute(array, size, attribute.normalized));
  }
  geometry.setIndex(Array.from(index, (vertex) => map.get(vertex)));
  return geometry;
}

/** Keeps the triangles whose three corners mostly follow the given bones (the head and neck). */
function keepHead(mesh, headBones) {
  const keep = new Set(mesh.skeleton.bones.flatMap((bone, i) => (headBones.includes(bone.name) ? [i] : [])));
  const geometry = mesh.geometry;
  const joints = geometry.attributes.skinIndex;
  const weights = geometry.attributes.skinWeight;
  const index = geometry.index.array;
  const onHead = (v) => {
    let weight = 0;
    for (let k = 0; k < 4; k++) if (keep.has(joints.getComponent(v, k))) weight += weights.getComponent(v, k);
    return weight > 0.5;
  };
  const kept = [];
  for (let i = 0; i < index.length; i += 3) {
    if (onHead(index[i]) && onHead(index[i + 1]) && onHead(index[i + 2])) kept.push(index[i], index[i + 1], index[i + 2]);
  }
  geometry.setIndex(kept);
  return kept.length / 3;
}

window.__ready = true;
</script>
